services:
  db:
    image: mysql:8.0
    restart: on-failure
    environment:
      - MYSQL_ROOT_PASSWORD=base44root
      - MYSQL_DATABASE=twitter_clone
    volumes:
      - db_data:/var/lib/mysql
      - ./.base44/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pbase44root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./:/var/www/html
    command: ["sh", "-c", "chmod 755 /var/www/html && exec apache2-foreground"]
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=base44root
      - DB_NAME=twitter_clone
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
